<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Nadu Traffic Police - Register</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="container">
        <div class="register-box">
            <!-- Header Section -->
            <div class="header">
                <div class="emblem">
                    <img src="images/tn-police-logo.png" alt="Tamil Nadu Police Logo" width="70" height="70">
                </div>
                <h1>Officer Registration</h1>
                <p class="subtitle">Join Tamil Nadu Traffic Police Portal</p>
            </div>

            <!-- Registration Form -->
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName">
                            <span class="icon">👤</span>
                            Full Name
                        </label>
                        <input type="text" id="fullName" name="fullName" required 
                               placeholder="Enter full name">
                    </div>

                    <div class="form-group">
                        <label for="officerId">
                            <span class="icon">🆔</span>
                            Officer ID
                        </label>
                        <input type="text" id="officerId" name="officerId" required 
                               placeholder="Enter officer ID">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">
                        <span class="icon">📧</span>
                        Email Address
                    </label>
                    <input type="email" id="email" name="email" required 
                           placeholder="officer@tnpolice.gov.in">
                </div>

                <div class="form-group">
                    <label for="mobile">
                        <span class="icon">📱</span>
                        Mobile Number
                    </label>
                    <input type="tel" id="mobile" name="mobile" required 
                           placeholder="+91 XXXXX XXXXX" pattern="[0-9]{10}">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="rank">
                            <span class="icon">⭐</span>
                            Rank
                        </label>
                        <select id="rank" name="rank" required>
                            <option value="">Select Rank</option>
                            <option value="Constable">Constable</option>
                            <option value="Head Constable">Head Constable</option>
                            <option value="Sub-Inspector">Sub-Inspector</option>
                            <option value="Inspector">Inspector</option>
                            <option value="Deputy Superintendent">Deputy Superintendent</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="station">
                            <span class="icon">🏢</span>
                            Station
                        </label>
                        <input type="text" id="station" name="station" required 
                               placeholder="Station name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">
                        <span class="icon">👤</span>
                        Username
                    </label>
                    <input type="text" id="username" name="username" required 
                           placeholder="Choose a username" minlength="4">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">
                            <span class="icon">🔒</span>
                            Password
                        </label>
                        <input type="password" id="password" name="password" required 
                               placeholder="Create password" minlength="6">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">
                            <span class="icon">🔒</span>
                            Confirm Password
                        </label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required 
                               placeholder="Re-enter password">
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="terms" required>
                        <span>I agree to the Terms & Conditions and Privacy Policy</span>
                    </label>
                </div>

                <button type="submit" class="register-btn">
                    <span>Register</span>
                    <span class="arrow">✓</span>
                </button>
            </form>

            <!-- Login Link -->
            <div class="login-section">
                <p>Already have an account?</p>
                <button onclick="window.location.href='login.html'" class="login-link-btn">
                    Login Here
                </button>
            </div>

            <!-- Footer -->
            <div class="footer">
                <p>© 2025 Tamil Nadu Traffic Police Department</p>
            </div>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
