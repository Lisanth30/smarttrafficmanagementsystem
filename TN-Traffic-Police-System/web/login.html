<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Nadu Traffic Police - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <!-- Header Section with Emblem -->
            <div class="header">
                <div class="emblem">
                    <img src="images/tn-police-logo.png" alt="Tamil Nadu Police Logo" width="80" height="80">
                </div>
                <h1>Tamil Nadu Traffic Police</h1>
                <p class="motto">Truth Alone Triumphs</p>
                <p class="motto-tamil">சத்யமேவ ஜெயதே</p>
                <p class="tagline">Serving with Dedication | Enforcing with Compassion</p>
            </div>

            <!-- Login Type Selection -->
            <div class="login-type-selector">
                <button class="type-btn active" onclick="switchLoginType('master')" id="masterBtn">
                    <span>🔐</span> Master Login
                </button>
                <button class="type-btn" onclick="switchLoginType('normal')" id="normalBtn">
                    <span>👤</span> Normal Login
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">
                        <span class="icon">👤</span>
                        <span id="userLabel">Username / Officer ID</span>
                    </label>
                    <input type="text" id="username" name="username" required 
                           placeholder="Enter your username or ID">
                </div>

                <div class="form-group">
                    <label for="password">
                        <span class="icon">🔒</span>
                        Password
                    </label>
                    <input type="password" id="password" name="password" required 
                           placeholder="Enter your password">
                </div>

                <div class="form-group" id="masterKeyGroup" style="display: none;">
                    <label for="masterKey">
                        <span class="icon">🔑</span>
                        Master Key
                    </label>
                    <input type="password" id="masterKey" name="masterKey" 
                           placeholder="Enter master security key">
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <span>Login</span>
                    <span class="arrow">→</span>
                </button>
            </form>

            <!-- Register Section -->
            <div class="register-section">
                <p>New Officer? Need to register?</p>
                <button onclick="window.location.href='register.html'" class="register-btn">
                    Register Now
                </button>
            </div>

            <!-- Footer -->
            <div class="footer">
                <p>© 2025 Tamil Nadu Traffic Police Department</p>
                <p class="emergency">Emergency: 📞 100 | Traffic Helpline: 📞 103</p>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
